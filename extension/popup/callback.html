<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录中…</title>
<style>
  body {
    margin: 0; padding: 0;
    background: #0a0b0f; color: #e8eaed;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .card {
    text-align: center; padding: 40px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #1e222b;
    border-top-color: #27d98b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  .msg { font-size: 14px; color: #9ca3af; }
  .ok { color: #27d98b; }
  .err { color: #ff6b6b; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">正在完成登录…</div>
</div>
<script src="callback.js"></script>
</body>
</html>
